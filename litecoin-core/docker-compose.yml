version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: $APP_LITECOIN_NODE_IP
      APP_PORT: 3000

  app:
    image: ghcr.io/ryleastark/umbrel-litecoin-core-gui:v0.1.1@sha256:ab0679a26f48ac53e2eda4b0865cab637f1617ed7a2227e57c0250449f0ac83a
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 15m
    ports:
      - "${APP_LITECOIN_P2P_PORT}:${APP_LITECOIN_P2P_PORT}"
      - "${APP_LITECOIN_RPC_PORT}:${APP_LITECOIN_RPC_PORT}"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      LITECOIN_DIR: /data/litecoin
      APP_STATE_DIR: /data/app
      LITECOIND_IP: "${APP_LITECOIN_NODE_IP}"
      RPC_USER: "${APP_LITECOIN_RPC_USER}"
      RPC_PASS: "${APP_LITECOIN_RPC_PASS}"
      RPC_PORT: "${APP_LITECOIN_RPC_PORT}"
      P2P_PORT: "${APP_LITECOIN_P2P_PORT}"
      TOR_PORT: "${APP_LITECOIN_TOR_PORT}"
      ZMQ_RAWBLOCK_PORT: "${APP_LITECOIN_ZMQ_RAWBLOCK_PORT}"
      ZMQ_RAWTX_PORT: "${APP_LITECOIN_ZMQ_RAWTX_PORT}"
      ZMQ_HASHBLOCK_PORT: "${APP_LITECOIN_ZMQ_HASHBLOCK_PORT}"
      ZMQ_SEQUENCE_PORT: "${APP_LITECOIN_ZMQ_SEQUENCE_PORT}"
      ZMQ_HASHTX_PORT: "${APP_LITECOIN_ZMQ_HASHTX_PORT}"
      TOR_HOST: "${TOR_PROXY_IP}"
      TOR_SOCKS_PORT: "9050"
      TOR_CONTROL_PORT: "9051"
      TOR_CONTROL_PASSWORD: "moneyprintergobrrr"
    networks:
      default:
        ipv4_address: $APP_LITECOIN_NODE_IP
