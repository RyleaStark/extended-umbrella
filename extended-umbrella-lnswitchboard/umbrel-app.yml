  - lightning
repo: https://github.com/RyleaStark/lnSwitchboard
support: https://github.com/RyleaStark/lnSwitchboard/issues
port: 22121
releaseNotes: >-
  Adds a private authoritative invoice settlement lookup using the existing invoices:create bearer scope: no token rotation or re-provisioning. Checks exact invoice/address/quote ownership and authoritative LND hash, amount, creation and expiry; reports actual paid msat and settlement UTC seconds without secrets or invoice creation. Existing client IDs, tokens and callback routes are preserved. Native callbacks are only wake-up hints; credit requires a fresh authenticated lookup. Includes supported lint-toolchain security remediation with preserved rule coverage. Dashboard remains Umbrel-authenticated on 22121; bearer API stays private on 22122; public LNURL remains on 21212. Never expose 22122 to the Internet. No live routing changes are applied by this package.
submitter: "Rylea Stark"
