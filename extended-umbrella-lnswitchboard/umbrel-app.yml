port: 22121
releaseNotes: >-
  v0.4.0.rc4 package update. Fixes the capability-free userspace Tailscale sidecar by running it and its state/control/status/socket artifacts as UID/GID 1000:1000; it no longer attempts forbidden runtime ownership changes. The pinned lnSwitchboard RC3 image and all existing data remain unchanged. No live Cloudflare or Tailscale authorization is initiated by installation.
