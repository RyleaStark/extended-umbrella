port: 22121
releaseNotes: >-
  Fixes interruption recovery for the App Proxy privacy-config publisher and makes retirement of legacy SQLite journal/WAL/SHM compatibility links descriptor-bound, crash-recoverable, and fail-closed against final pathname replacement. Preserves historical and interim records across upgrades, rollbacks, and re-upgrades with a durable manifest binding every database, key, SQLite sidecar, and archive. RC22 separates the authenticated administration service from a bounded secretless public gateway connected over a hardened Unix socket; only port 21212 reaches public LNURL and NIP-05 routes, while LND credentials, provider secrets, and operational state remain confined to the administration process.
