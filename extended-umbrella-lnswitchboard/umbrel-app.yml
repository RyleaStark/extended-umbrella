releaseNotes: >-
  Preserves historical and interim records across upgrades, rollbacks, and re-upgrades with a durable manifest that binds each database, key, sidecar, and archive before cleanup. RC20 adds application-owned cross-platform OAuth callback and logging privacy, idempotent webhook-history redaction, authenticated Umbrel proxy mode with silent-log defense in depth, exact LND mounts, and isolated Mesh and Tailscale runtimes.
