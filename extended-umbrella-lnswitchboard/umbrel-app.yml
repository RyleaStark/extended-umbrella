port: 22121
releaseNotes: >-
  Adds zrok as a third public-ingress provider with both managed zrok Cloud and self-hosted environment modes. zrok receives only the secretless public listener on port 21212, with dedicated enrollment and runtime state; the dashboard and administrative authority remain private on port 22121. Cloud setup uses a persistent reserved name and warns that account verification is required to remove zrok's browser interstitial for Lightning and NIP-05 machine clients. Includes the RC22 persistence, recovery, and listener-isolation hardening.
