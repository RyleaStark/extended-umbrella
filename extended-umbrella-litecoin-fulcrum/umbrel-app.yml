manifestVersion: 1.1
id: extended-umbrella-litecoin-fulcrum
implements:
  - extended-umbrella-litecoin-electrs
category: bitcoin
name: "Fulcrum (LTC)"
version: "2.1.1-umbrel.7"
tagline: "A fast Litecoin Electrum server"
description: >-
  Run a personal Litecoin Electrum server powered by Fulcrum and Litecoin Core.
developer: Calin Culianu and RyleaStark
website: https://fulcrumserver.org/
dependencies:
  - extended-umbrella-litecoin-core
repo: https://github.com/RyleaStark/umbrel-litecoin-fulcrum-gui
support: https://github.com/RyleaStark/umbrel-litecoin-fulcrum-gui/issues
port: 2109
icon: https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-fulcrum/gallery/icon.png
gallery:
  - https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-fulcrum/gallery/1.png
path: ""
defaultPassword: ""
releaseNotes: >-
  Introduces a fully redesigned, responsive Fulcrum interface with clearer runtime and
  synchronization status, accessible local and Tor connection details, and locally generated
  wallet QR codes. The Fulcrum 2.1.1 daemon, persistent index, provider compatibility, and
  Litecoin wallet port 51002 remain unchanged.
backupIgnore:
  - data/fulcrum/fulc2_db
submitter: "Rylea Stark"
submission: https://github.com/RyleaStark/extended-umbrella