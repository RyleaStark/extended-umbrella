services:
  state_migrate:
    image: ghcr.io/ryleastark/lnswitchboard:0.4.0.rc35@sha256:7d0faaff3c270e2cc6ffe0a91b0da852e5c04d36537e2dc62be20350d5a50fab
    container_name: ${APP_ID}_state-migrate
    user: "0:0"
    entrypoint: ["python", "/opt/lnswitchboard/state-migrate.py"]
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${APP_DATA_DIR}/data:/app-data
      - ${APP_DATA_DIR}/data:/host-view:ro
      - ${APP_DATA_DIR}/hooks/state-migrate.py:/opt/lnswitchboard/state-migrate.py:ro
    tmpfs:
      - /tmp:size=16m,mode=0700
      - /app-data/connectors:size=64k,mode=000
    restart: "no"

  permissions-init:
    image: ghcr.io/ryleastark/lnswitchboard:0.4.0.rc35@sha256:7d0faaff3c270e2cc6ffe0a91b0da852e5c04d36537e2dc62be20350d5a50fab
    container_name: ${APP_ID}_permissions-init
    depends_on:
      state_migrate:
        condition: service_completed_successfully
    user: "0:0"
    entrypoint: ["python", "/opt/lnswitchboard/prepare-state-guard.py"]
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${APP_DATA_DIR}/data:/host-view:ro
      - ${APP_DATA_DIR}/data/secrets:/app-secrets
      - ${APP_DATA_DIR}/data/connectors/cloudflare-mesh:/app-secrets/cloudflare-mesh
      - ${APP_DATA_DIR}/data/secrets/tailscale:/tailscale-control
      - ${APP_DATA_DIR}/data/connectors/tailscale:/tailscale-state
      - ${APP_DATA_DIR}/data/secrets/zrok:/zrok-control
      - ${APP_DATA_DIR}/data/connectors/zrok:/zrok-state
      - ${APP_DATA_DIR}/data/public-backend:/public-socket
      - ${APP_DATA_DIR}/data/proxy-config:/proxy-config
      - ${APP_DATA_DIR}/data/connectors/cloudflare-mesh-state:/cloudflare-mesh-state
      - ${APP_DATA_DIR}/hooks/prepare-state-guard.py:/opt/lnswitchboard/prepare-state-guard.py:ro
    restart: "no"

  app_proxy:
    environment:
      APP_HOST: lnswitchboard
      APP_PORT: 22121
      LOG_LEVEL: silent
      CUSTOM_DOTENV_FILE: /lnswitchboard-proxy-config/app-proxy.env
    volumes:
      - ${APP_DATA_DIR}/data/proxy-config:/lnswitchboard-proxy-config:ro
    depends_on:
      lnswitchboard:
        condition: service_healthy
    restart: on-failure

  lnswitchboard:
    image: ghcr.io/ryleastark/lnswitchboard:0.4.0.rc35@sha256:7d0faaff3c270e2cc6ffe0a91b0da852e5c04d36537e2dc62be20350d5a50fab
    container_name: ${APP_ID}_web
    user: "1000:1000"
    restart: on-failure
    depends_on:
      permissions-init:
        condition: service_completed_successfully
    read_only: true
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      LISTENER_MODE: admin
      DATA_STORE_PATH: /app/secrets/lnswitchboard.db
      PUBLIC_BACKEND_SOCKET_PATH: /run/lnswitchboard-public/public.sock
      SERVICE_PORT: "22121"
      PUBLIC_SERVICE_PORT: "21212"
      DEP_ENV: "UMBREL_DEV"
      LND_HOST: "${APP_LIGHTNING_NODE_IP}"
      LND_GRPC_PORT: "10009"
      LND_TLS_PATH: "/lnd/tls.cert"
      LND_MACAROON_PATH: "/lnd/invoice.macaroon"
      LND_READONLY_MACAROON_PATH: "/lnd/readonly.macaroon"
      TRUSTED_HOSTS: "*"
      TRUSTED_PROXY_CIDRS: "10.21.0.0/16"
      CLOUDFLARED_CONNECTOR_ENABLED: "true"
      CLOUDFLARED_TOKEN_PATH: "/app/secrets/cloudflare-mesh/node.env"
      CLOUDFLARED_TOKEN_GID: "1000"
      CLOUDFLARED_ORIGIN_URL: "http://extended-umbrella-lnswitchboard-public:21212"
      CLOUDFLARE_OAUTH_CLIENT_ID: "${CLOUDFLARE_OAUTH_CLIENT_ID:-}"
      CLOUDFLARE_OAUTH_REDIRECT_LOOPBACK: "${CLOUDFLARE_OAUTH_REDIRECT_LOOPBACK:-http://127.0.0.1:22121/api/cloudflare/oauth/callback}"
      CLOUDFLARE_OAUTH_REDIRECT_PAGE: "${CLOUDFLARE_OAUTH_REDIRECT_PAGE:-https://placeholder.invalid/oauth/callback}"
      TAILSCALE_CONNECTOR_ENABLED: "true"

      TAILSCALE_CONTROL_DIR: "/app/secrets/tailscale/control"
      TAILSCALE_STATUS_DIR: "/app/secrets/tailscale/status"
      ZROK_CONNECTOR_ENABLED: "true"

      ZROK_CONTROL_DIR: "/app/secrets/zrok/control"
      ZROK_STATUS_DIR: "/app/secrets/zrok/status"
    volumes:
      - ${APP_LIGHTNING_NODE_DATA_DIR}/tls.cert:/lnd/tls.cert:ro
      - ${APP_LIGHTNING_NODE_DATA_DIR}/data/chain/bitcoin/${APP_BITCOIN_NETWORK}/invoice.macaroon:/lnd/invoice.macaroon:ro
      - ${APP_LIGHTNING_NODE_DATA_DIR}/data/chain/bitcoin/${APP_BITCOIN_NETWORK}/readonly.macaroon:/lnd/readonly.macaroon:ro
      - ${APP_DATA_DIR}/data/secrets:/app/secrets
      - ${APP_DATA_DIR}/data/connectors/cloudflare-mesh:/app/secrets/cloudflare-mesh
      - ${APP_DATA_DIR}/data/public-backend:/run/lnswitchboard-public
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:22121/api/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  lnswitchboard-public:
    image: ghcr.io/ryleastark/lnswitchboard:0.4.0.rc35@sha256:7d0faaff3c270e2cc6ffe0a91b0da852e5c04d36537e2dc62be20350d5a50fab
    container_name: ${APP_ID}_public
    user: "1000:1000"
    restart: on-failure
    depends_on:
      permissions-init:
        condition: service_completed_successfully
      lnswitchboard:
        condition: service_healthy
    read_only: true
    mem_limit: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      LISTENER_MODE: public
      PUBLIC_BACKEND_SOCKET_PATH: /run/lnswitchboard-public/public.sock
      PUBLIC_SERVICE_PORT: "21212"
    volumes:
      - ${APP_DATA_DIR}/data/public-backend:/run/lnswitchboard-public:ro
    ports:
      - "21212:21212"
    networks:
      cloudflare-egress:
        aliases:
          - extended-umbrella-lnswitchboard-public
          - lnswitchboard-public
          - lns.internal
      zrok-public:
        aliases:
          - extended-umbrella-lnswitchboard-public
          - public
      tailscale-public:
        aliases:
          - extended-umbrella-lnswitchboard-public
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.error, urllib.request;
          url='http://127.0.0.1:21212/api/health';
          code=None;
          exec("try:\n urllib.request.urlopen(url, timeout=2).read()\nexcept urllib.error.HTTPError as exc:\n code=exc.code");
          raise SystemExit(0 if code == 404 else 1)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  cloudflare-mesh:
    image: cloudflare/mesh:2026.7.0@sha256:18fad6d500e8ca48b7e4d5ae1905d65e8a50c1f5f5e21eba020d54d5cbf82571
    container_name: ${APP_ID}_cloudflare-mesh
    entrypoint: ["sh", "/opt/lnswitchboard/mesh-entrypoint.sh"]
    restart: on-failure
    stop_grace_period: 30s
    group_add:
      - "1000"
    depends_on:
      permissions-init:
        condition: service_completed_successfully
      lnswitchboard-public:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
      net.ipv6.conf.default.forwarding: "1"
    environment:
      MESH_NODE_TOKEN_FILE: /run/lnswitchboard/node.env
    volumes:
      - ${APP_DATA_DIR}/data/connectors/cloudflare-mesh:/run/lnswitchboard:ro
      - ${APP_DATA_DIR}/data/connectors/cloudflare-mesh-state:/var/lib/cloudflare-warp
      - ${APP_DATA_DIR}/hooks/mesh-entrypoint.sh:/opt/lnswitchboard/mesh-entrypoint.sh:ro
    networks:
      - cloudflare-egress

  tailscale:
    image: tailscale/tailscale:v1.102.2@sha256:321ce041508c19079b57a28b6666c8d81ab0b08accc0a2585b3ab663d557ac24
    container_name: ${APP_ID}_tailscale
    entrypoint: ["/usr/local/bin/lnswitchboard-tailscale-supervisor"]
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      permissions-init:
        condition: service_completed_successfully
      lnswitchboard-public:
        condition: service_healthy
    networks:
      - tailscale-public
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "true"
      TS_CONTROL_DIR: /run/lnswitchboard/control
      TS_STATUS_DIR: /run/lnswitchboard/status
      TS_LOGIN_RETENTION_SECONDS: "300"
      TS_NO_LOGS_NO_SUPPORT: "true"
      DEP_ENV: "UMBREL_DEV"
    volumes:
      - ${APP_DATA_DIR}/data/connectors/tailscale:/var/lib/tailscale
      - ${APP_DATA_DIR}/data/secrets/tailscale:/run/lnswitchboard
      - ${APP_DATA_DIR}/hooks/tailscale-supervisor.sh:/usr/local/bin/lnswitchboard-tailscale-supervisor:ro
    tmpfs:
      - /var/run/tailscale:size=16m,mode=0750,uid=1000,gid=1000
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/tailscale/tailscaled.sock"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  zrok:
    image: openziti/zrok2:2.0.4@sha256:310ab634172ce03dd23ff1ee8515195e1a564197dbc4e6cdfd57dad2fb822400
    container_name: ${APP_ID}_zrok
    entrypoint: ["/usr/local/bin/lnswitchboard-zrok-supervisor"]
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      permissions-init:
        condition: service_completed_successfully
      lnswitchboard-public:
        condition: service_healthy
    read_only: true
    mem_limit: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /var/lib/zrok
      ZROK2_HEADLESS: "true"
      ZROK_CONTROL_DIR: /run/lnswitchboard/control
      ZROK_STATUS_DIR: /run/lnswitchboard/status
      DEP_ENV: "UMBREL_DEV"
    volumes:
      - ${APP_DATA_DIR}/data/connectors/zrok:/var/lib/zrok
      - ${APP_DATA_DIR}/data/secrets/zrok:/run/lnswitchboard
      - ${APP_DATA_DIR}/hooks/zrok-supervisor.sh:/usr/local/bin/lnswitchboard-zrok-supervisor:ro
    networks:
      - zrok-public
    tmpfs:
      - /tmp:size=16m,mode=1777

networks:
  cloudflare-egress:
    driver: bridge
  zrok-public:
    driver: bridge
  tailscale-public:
    driver: bridge
