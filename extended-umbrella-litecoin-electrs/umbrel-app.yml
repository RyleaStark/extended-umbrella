manifestVersion: 1
id: extended-umbrella-litecoin-electrs
category: bitcoin
name: "Electrs (LTC)"
version: "3.4.0-dev.3752866-umbrel.6"
tagline: "A private Litecoin Electrum server powered by Electrs"
description: >-
  Run a personal Electrum server for Litecoin using the maintained rust-litecoin fork of
  mempool-electrs. Electrs (LTC) builds a private light-mode index from your Litecoin Core node
  over JSON-RPC and serves wallet history over your local network or Tor on port 51001.
developer: rust-litecoin, mempool, and RyleaStark
website: https://github.com/RyleaStark/umbrel-litecoin-electrs
dependencies:
  - extended-umbrella-litecoin-core
repo: https://github.com/RyleaStark/umbrel-litecoin-electrs
support: https://github.com/RyleaStark/umbrel-litecoin-electrs/issues
port: 2111
icon: https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-electrs/gallery/icon.png
gallery:
  - https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-electrs/gallery/1.png
path: ""
defaultPassword: ""
releaseNotes: >-
  Moves the maintained Distroless daemon to the canonical umbrel-litecoin-electrs container package and pins its new
  immutable multi-architecture image. The private cookie-file RPC credential boundary and distinct electrs-v3 state path
  from the previous hotfix remain in place, preserving legacy index bytes for rollback. The provider contract, GUI,
  Local/Tor behavior, and wallet port 51001 remain unchanged.
backupIgnore:
  - data/electrs
  - data/electrs-v3
submitter: "Rylea Stark"
submission: https://github.com/RyleaStark/extended-umbrella
