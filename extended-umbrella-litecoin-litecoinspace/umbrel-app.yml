manifestVersion: 1
id: extended-umbrella-litecoin-litecoinspace
category: bitcoin
name: "Litecoin Space"
version: "3.3.1-umbrel.7"
tagline: "Explore your own Litecoin node"
description: >-
  Litecoin Space is a self-hosted Litecoin block explorer and mempool visualizer.

  This Extended Umbrella package connects the Litecoin Foundation's Litecoin Space fork to your local Litecoin Core and Fulcrum LTC apps, keeping blockchain queries on your Umbrel.

  This product includes GeoLite2 data created by MaxMind, available from https://www.maxmind.com.
releaseNotes: >-
  Republishes the frontend and backend under the standardized
  umbrel-litecoin-litecoinspace package namespace, with signed-source OCI provenance and immutable
  multi-platform image pins. The application ID, database, persistent data paths, Electrs provider
  contract, native Fulcrum port 51002, and Litecoin Space 3.3.1 runtime remain unchanged.
developer: "Litecoin Foundation and RyleaStark"
website: https://litecoinspace.org
dependencies:
  - extended-umbrella-litecoin-core
  - extended-umbrella-litecoin-electrs
repo: https://github.com/RyleaStark/umbrel-litecoinspace
support: https://github.com/RyleaStark/umbrel-litecoinspace/issues
port: 3012
icon: https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-litecoinspace/gallery/icon.svg
gallery:
  - https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-litecoinspace/gallery/1.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: "Rylea Stark"
submission: https://github.com/RyleaStark/extended-umbrella
