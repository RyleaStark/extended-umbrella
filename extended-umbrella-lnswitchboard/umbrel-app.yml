port: 22121
releaseNotes: >-
  Completes zrok lifecycle hardening after independent adversarial review. Refresh now reconciles the current provider share for the exact environment, target, mode, and endpoint; disconnect is bound to the reserved identity; failed startup state is recoverable; and cleanup cannot delete a same-account share owned by another zrok environment. zrok remains restricted to the secretless public listener on port 21212.
