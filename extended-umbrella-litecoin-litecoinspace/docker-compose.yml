services:
  app_proxy:
    environment:
      APP_HOST: $APP_LITECOIN_LITECOINSPACE_IP
      APP_PORT: $APP_LITECOIN_LITECOINSPACE_PORT
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/ryleastark/umbrel-litecoinspace-frontend:v3.3.1-umbrel.2@sha256:bf47bac4caa3058ce956d47b50d415f2e5377a0e0610790b20eef9a4314b39ac
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    command: "./wait-for mariadb:3306 --timeout=720 -- nginx -g 'daemon off;'"
    environment:
      FRONTEND_HTTP_PORT: $APP_LITECOIN_LITECOINSPACE_PORT
      BACKEND_MAINNET_HTTP_HOST: $APP_LITECOIN_LITECOINSPACE_API_IP
      BACKEND_MAINNET_HTTP_PORT: "8999"
      NGINX_PORT: $APP_LITECOIN_LITECOINSPACE_PORT
      NGINX_HOSTNAME: $APP_LITECOIN_LITECOINSPACE_API_IP
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:$APP_LITECOIN_LITECOINSPACE_PORT/ | grep -q '<html' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      default:
        ipv4_address: $APP_LITECOIN_LITECOINSPACE_IP

  api:
    image: ghcr.io/ryleastark/umbrel-litecoinspace-backend:v3.3.1-umbrel.2@sha256:d81a3504dc1be2f94d1e89af9450fc53f93992eb1fcacd42970b5890cf046963
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      mariadb:
        condition: service_healthy
    command: "./wait-for-it.sh mariadb:3306 --timeout=720 --strict -- ./start.sh"
    volumes:
      - ${APP_DATA_DIR}/data:/backend/cache
    environment:
      MEMPOOL_NETWORK: "mainnet"
      MEMPOOL_BACKEND: "electrum"
      CORE_RPC_HOST: $APP_LITECOIN_NODE_IP
      CORE_RPC_PORT: $APP_LITECOIN_RPC_PORT
      CORE_RPC_USERNAME: $APP_LITECOIN_RPC_USER
      CORE_RPC_PASSWORD: $APP_LITECOIN_RPC_PASS
      ELECTRUM_HOST: $APP_LITECOIN_ELECTRS_NODE_IP
      ELECTRUM_PORT: $APP_LITECOIN_ELECTRS_NODE_PORT
      ELECTRUM_TLS_ENABLED: "false"
      DATABASE_ENABLED: "true"
      DATABASE_HOST: $APP_LITECOIN_LITECOINSPACE_DB_IP
      DATABASE_PORT: "3306"
      DATABASE_DATABASE: "mempool"
      DATABASE_USERNAME: "mempool"
      DATABASE_PASSWORD: "mempool"
      MEMPOOL_HTTP_PORT: "8999"
      MEMPOOL_CACHE_DIR: "/backend/cache"
      MEMPOOL_CLEAR_PROTECTION_MINUTES: "20"
      MEMPOOL_INDEXING_BLOCKS_AMOUNT: "52560"
      MEMPOOL_STDOUT_LOG_MIN_PRIORITY: "info"
      STATISTICS_ENABLED: "true"
      LIGHTNING_ENABLED: "false"
      NODE_OPTIONS: "--max-old-space-size=${APP_LITECOIN_LITECOINSPACE_NODE_MAX_OLD_SPACE_SIZE:-1024}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8999/api/v1/backend-info | grep -q . || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 2m
    networks:
      default:
        ipv4_address: $APP_LITECOIN_LITECOINSPACE_API_IP

  mariadb:
    image: mariadb:10.5.21@sha256:f3ec8c1d1cd3d62a21e7c6e3dee4cb33227c7df6dab5644bf2c077e21dfbc63d
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/mysql/data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: "mempool"
      MYSQL_USER: "mempool"
      MYSQL_PASSWORD: "mempool"
      MYSQL_ROOT_PASSWORD: "moneyprintergobrrr"
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mempool", "-pmempool"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      default:
        ipv4_address: $APP_LITECOIN_LITECOINSPACE_DB_IP
