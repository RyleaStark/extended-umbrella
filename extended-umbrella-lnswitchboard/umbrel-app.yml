port: 22121
releaseNotes: >-
  v0.4.0.rc3 development candidate. Cloudflare onboarding now configures an existing operator-supplied account and tunnel ID with a write-only API token; it uses current Cloudflare One connector permission guidance and never creates or deletes the tunnel. The userspace-only Tailscale Funnel helper is packaged through Umbrel's installer-supported hooks directory so its sidecar starts and consumes private connector commands. Administration remains on Umbrel's authenticated app proxy at port 22121 while the route-restricted public listener is host-published on port 21212. No live Cloudflare or Tailscale authorization is initiated by installation.
