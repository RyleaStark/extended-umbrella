manifestVersion: 1
id: extended-umbrella-litecoin-core
category: bitcoin
name: "Litecoin Core"
version: "0.21.5.5-umbrel.5"
tagline: "Run your personal Litecoin node"

description: >-
  Run a fully validating Litecoin node, powered by Litecoin Core.


  The node uses the official Litecoin Core v0.21.5.5 image, pinned by immutable digest. Its Umbrel UI is a Litecoin-specific adaptation of Umbrel's Bitcoin Node interface with silver Litecoin branding.
releaseNotes: >-
  Completes Litecoin blue and silver propagation across shared theme tokens, charts,
  active controls, keyboard focus states, and browser/PWA metadata; the runtime remains
  Litecoin Core v0.21.5.5.

developer: Litecoin Project and RyleaStark
website: https://litecoin.org
dependencies: []
repo: https://github.com/RyleaStark/umbrel-litecoin-core-gui
support: https://github.com/RyleaStark/umbrel-litecoin-core-gui/issues

port: 2110
icon: https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-core/gallery/icon.png
gallery:
  - https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-core/gallery/1.png
path: ""

defaultUsername: ""
defaultPassword: ""
backupIgnore:
  - data/litecoin/blocks
  - data/litecoin/chainstate
  - data/litecoin/indexes

submitter: "Rylea Stark"
submission: https://github.com/RyleaStark/extended-umbrella