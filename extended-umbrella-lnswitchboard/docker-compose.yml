services:
  init:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    container_name: ${APP_ID}_init
    command:
      - sh
      - -c
      - |
        set -eu
        install -d -m 0750 -o 1000 -g 1000 /data
        install -d -m 0750 -o 1000 -g 1000 /data/tls
        install -d -m 0700 -o 1000 -g 1000 /cloudflare-mesh-token
        install -d -m 0700 -o 0 -g 0 /cloudflare-mesh-state
        install -d -m 0700 -o 1000 -g 1000 /tailscale-state
        install -d -m 0700 -o 1000 -g 1000 /tailscale-socket
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/data/connectors/cloudflare-mesh:/cloudflare-mesh-token
      - ${APP_DATA_DIR}/data/connectors/cloudflare-mesh-state:/cloudflare-mesh-state
      - ${APP_DATA_DIR}/data/connectors/tailscale:/tailscale-state
      - ${APP_DATA_DIR}/data/connectors/tailscale-socket:/tailscale-socket
    restart: "no"

  app_proxy:
    environment:
      APP_HOST: lnswitchboard
      APP_PORT: 22121
    depends_on:
      lnswitchboard:
        condition: service_healthy
    restart: on-failure

  lnswitchboard:
    image: ghcr.io/ryleastark/lnswitchboard:0.4.0.rc15@sha256:9ee6cdea6deaa25b88efde9c5e4309f4862cfaf6dd1b76429053610dcd193857
    container_name: ${APP_ID}_web
    user: "1000:1000"
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      SERVICE_PORT: "22121"
      PUBLIC_SERVICE_PORT: "21212"
      LND_HOST: "${APP_LIGHTNING_NODE_IP}"
      LND_GRPC_PORT: "10009"
      LND_TLS_PATH: "/lnd/tls.cert"
      LND_MACAROON_PATH: "/lnd/data/chain/bitcoin/${BITCOIN_NETWORK}/admin.macaroon"
      LND_MACAROON_TYPE: "admin"
      LNS_BACKEND: "lnd"
      LNS_TRUSTED_HOSTS: "*"
      LNS_TRUSTED_PROXY_IPS: "10.21.0.0/16"
      LNS_TRUSTED_PROXIES: "10.21.0.0/16"
      CLOUDFLARED_CONNECTOR_ENABLED: "true"
      CLOUDFLARED_TOKEN_PATH: "/app/cloudflare-mesh/node.env"
      CLOUDFLARED_TOKEN_GID: "1000"
      CLOUDFLARED_ORIGIN_URL: "http://lnswitchboard:21212"
      CLOUDFLARE_OAUTH_CLIENT_ID: "${CLOUDFLARE_OAUTH_CLIENT_ID:-}"
      CLOUDFLARE_OAUTH_CALLBACK_URL: "${CLOUDFLARE_OAUTH_CALLBACK_URL:-http://127.0.0.1:22121/api/cloudflare/oauth/callback}"
      CLOUDFLARE_OAUTH_PAGE_CALLBACK_URL: "${CLOUDFLARE_OAUTH_PAGE_CALLBACK_URL:-https://oauth.lnswitchboard.app/callback/}"
      TAILSCALE_CONNECTOR_ENABLED: "true"
      TAILSCALE_SOCKET_PATH: "/var/run/tailscale/tailscaled.sock"
      TAILSCALE_METRICS_URL: "http://127.0.0.1:5252"
      TAILSCALE_AUTH_KEY: "${TAILSCALE_AUTH_KEY:-}"
      TAILSCALE_HOSTNAME: "lnswitchboard"
      TAILSCALE_STATE_DIR: "/var/lib/tailscale"
      TAILSCALE_SOCKET_DIR: "/var/run/tailscale"
    volumes:
      - ${APP_LIGHTNING_NODE_DATA_DIR}:/lnd:ro
      - ${APP_DATA_DIR}/data:/app/secrets
      - ${APP_DATA_DIR}/data/connectors/cloudflare-mesh:/app/cloudflare-mesh
      - ${APP_DATA_DIR}/data/connectors/tailscale:/var/lib/tailscale
      - ${APP_DATA_DIR}/data/connectors/tailscale-socket:/var/run/tailscale
    networks:
      default:
        aliases:
          - lns.internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:22121/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  cloudflare-mesh:
    image: cloudflare/mesh:2026.7.0@sha256:18fad6d500e8ca48b7e4d5ae1905d65e8a50c1f5f5e21eba020d54d5cbf82571
    container_name: ${APP_ID}_cloudflare-mesh
    entrypoint: ["sh", "/opt/lnswitchboard/mesh-entrypoint.sh"]
    restart: on-failure
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
      lnswitchboard:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
    environment:
      MESH_NODE_TOKEN_FILE: /run/lnswitchboard/node.env
    volumes:
      - ${APP_DATA_DIR}/data/connectors/cloudflare-mesh:/run/lnswitchboard:ro
      - ${APP_DATA_DIR}/data/connectors/cloudflare-mesh-state:/var/lib/cloudflare-warp
      - ${APP_DATA_DIR}/hooks/mesh-entrypoint.sh:/opt/lnswitchboard/mesh-entrypoint.sh:ro

  tailscale:
    image: tailscale/tailscale:v1.88.4@sha256:360e10ad95ad03950f66df03e0dab66287f9f89076ee4012d50bc6adceafcdf3
    container_name: ${APP_ID}_tailscale
    user: "1000:1000"
    restart: on-failure
    depends_on:
      init:
        condition: service_completed_successfully
    network_mode: service:lnswitchboard
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run:size=16m,mode=0755
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "false"
      TS_ENABLE_METRICS: "true"
      TS_LOCAL_ADDR_PORT: "127.0.0.1:5252"
    volumes:
      - ${APP_DATA_DIR}/data/connectors/tailscale:/var/lib/tailscale
      - ${APP_DATA_DIR}/data/connectors/tailscale-socket:/var/run/tailscale
      - ${APP_DATA_DIR}/hooks/tailscale-supervisor:/usr/local/bin/lnswitchboard-tailscale-supervisor:ro
