manifestVersion: 1
id: extended-umbrella-litecoin-core
category: bitcoin
name: "Litecoin Node"
version: "0.21.5.6-umbrel.1"
tagline: "Run your personal Litecoin node"

description: >-
  Run a fully validating Litecoin node, powered by Litecoin Core.


  The node uses the official Litecoin Core v0.21.5.6 image, pinned by immutable digest. Its Umbrel UI is a Litecoin-specific adaptation of Umbrel's Bitcoin Node interface with silver Litecoin branding.
releaseNotes: >-
  Adds native umbrelOS desktop widgets for live Litecoin node statistics and blockchain
  Upgrades the runtime to Litecoin Core v0.21.5.6, including its MWEB/P2P validation and consensus-security update.

developer: Litecoin Project and RyleaStark
website: https://litecoin.org
dependencies: []
repo: https://github.com/RyleaStark/umbrel-litecoin-core-gui
support: https://github.com/RyleaStark/umbrel-litecoin-core-gui/issues

port: 2110
icon: https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-core/gallery/icon.png
gallery:
  - https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-core/gallery/1.png
  - https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-core/gallery/2.png
  - https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-core/gallery/3.png
  - https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-core/gallery/4.png
  - https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-core/gallery/5.png
path: ""

defaultUsername: ""
defaultPassword: ""
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "5s"
    endpoint: "app:3000/api/widget/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "11"
          subtext: "peers"
        - title: "Mempool"
          text: "24"
          subtext: "MB"
        - title: "Hashrate"
          text: "2"
          subtext: "PH/s"
        - title: "Blockchain size"
          text: "140"
          subtext: "GB"
  - id: "sync"
    type: "text-with-progress"
    refresh: "2s"
    endpoint: "app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Blockchain sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
backupIgnore:
  - data/litecoin/blocks
  - data/litecoin/chainstate
  - data/litecoin/indexes

submitter: "Rylea Stark"
submission: https://github.com/RyleaStark/extended-umbrella
