services:
  app_proxy:
    environment:
      APP_HOST: extended-umbrella-litecoin-electrs_app_1
      APP_PORT: 3006

  app:
    image: ghcr.io/ryleastark/umbrel-litecoin-electrs-gui:v0.1.2@sha256:5388d1fa940bed8edd58d4099b5fe32fbe6dabb3bdb0e6bc9f85be11d78fab8d
    depends_on: [electrs]
    restart: on-failure
    environment:
      ELECTRUM_HIDDEN_SERVICE: "${APP_LITECOIN_ELECTRS_RPC_HIDDEN_SERVICE}"
      ELECTRUM_LOCAL_SERVICE: "${DEVICE_DOMAIN_NAME}"
      ELECTRS_HOST: "${APP_LITECOIN_ELECTRS_NODE_IP}"
      ELECTRS_PORT: "${APP_LITECOIN_ELECTRS_NODE_PORT}"
      ELECTRUM_PORT: "${APP_LITECOIN_ELECTRS_NODE_PORT}"
      LITECOIN_HOST: "${APP_LITECOIN_NODE_IP}"
      RPC_USER: "${APP_LITECOIN_RPC_USER}"
      RPC_PASSWORD: "${APP_LITECOIN_RPC_PASS}"
      RPC_PORT: "${APP_LITECOIN_RPC_PORT}"
    networks:
      default:
        ipv4_address: $APP_LITECOIN_ELECTRS_IP

  electrs:
    image: ghcr.io/ryleastark/umbrel-electrs-ltc:v0.9.12-umbrel.3@sha256:f3073afe86af25dbd3c0767cbbc19cc2b8c5e7b5e238a7b635154e4912368514
    init: true
    stop_grace_period: 5m
    restart: on-failure
    environment:
      ELECTRS_LOG_FILTERS: INFO
      ELECTRS_DAEMON_RPC_ADDR: "${APP_LITECOIN_NODE_IP}:${APP_LITECOIN_RPC_PORT}"
      ELECTRS_DAEMON_P2P_ADDR: "${APP_LITECOIN_NODE_IP}:${APP_LITECOIN_P2P_PORT}"
      ELECTRS_ELECTRUM_RPC_ADDR: "0.0.0.0:${APP_LITECOIN_ELECTRS_NODE_PORT}"
      ELECTRS_SERVER_BANNER: "Electrs (LTC) on Umbrel"
      ELECTRS_AUTH: "${APP_LITECOIN_RPC_USER}:${APP_LITECOIN_RPC_PASS}"
      ELECTRS_DB_DIR: "/data/db"
    volumes:
      - "${APP_DATA_DIR}/data/electrs:/data/db"
    ports:
      - "${APP_LITECOIN_ELECTRS_NODE_PORT}:${APP_LITECOIN_ELECTRS_NODE_PORT}"
    networks:
      default:
        ipv4_address: $APP_LITECOIN_ELECTRS_NODE_IP

  tor:
    image: ghcr.io/getumbrel/tor:0.4.9.11@sha256:e382b8629c0dfef6ceb396b062622d4e4e955b19d6f16b883fd2c0723ad5671a
    user: "1000:1000"
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/torrc:/etc/tor/torrc:ro
      - ${TOR_DATA_DIR}:/data
    environment:
      HOME: "/tmp"
    networks:
      default:
        ipv4_address: "${APP_LITECOIN_ELECTRS_TOR_IP}"
