releaseNotes: >-
  v0.4.0.rc1 development candidate. Adds Cloudflare Tunnel and Tailscale Funnel sidecars that publish only lnSwitchboard’s public listener on port 21212. The administration listener remains behind Umbrel’s authenticated app proxy on port 22121. This is a separate test app; it does not update or migrate the stable lnSwitchboard installation. No live Cloudflare or Tailscale authorization is initiated by installation.
