port: 22121
releaseNotes: >-
  Adds native Settings → Machine clients to provision, list and revoke scoped billing-service access. Configure the fixed domain, webhook receiver and signing secret, choose scopes, then copy the one-time client token into your service’s secret manager. Shows actual private client listener state and setup instructions. The optional private-webhook opt-in is now available in Environment → Security; enable only for trusted HTTP/private receivers and restart to apply. Settlement evidence remains automatic; authorized clients choose each fixed invoice’s amount and 14- or 30-day expiry per request. Dashboard stays behind Umbrel login on 22121; private bearer API on 22122 and public LNURL on 21212 remain separate. Never forward port 22122 to the Internet; LAN HTTP is unencrypted. Existing data and integration contracts are preserved.
