dependencies: 
  - lightning
repo: https://github.com/RyleaStark/lnSwitchboard
support: https://github.com/RyleaStark/lnSwitchboard/issues
port: 22121
releaseNotes: >-
  Adds operator-only adoption of an existing local Lightning address into a scoped machine client without renaming the address, changing its webhooks, or rewriting historical invoices. Scoped clients may optionally verify the exact opaque ownership-reference hash on address reads; existing token scopes and response shape are unchanged. Adoption does not automatically move callbacks or credit past payments. The RC44 authoritative settlement lookup remains available. Dashboard remains Umbrel-authenticated on 22121; bearer API stays private on 22122; public LNURL remains on 21212. Never expose 22122 to the Internet. No live addresses or callback routes are changed by installing this package.
submitter: "Rylea Stark"
