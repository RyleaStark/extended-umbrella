manifestVersion: 1.1
id: extended-umbrella-litecoin-electrumx
implements:
  - extended-umbrella-litecoin-electrs
category: bitcoin
name: "ElectrumX (LTC)"
version: "2.0.0-umbrel.12"
tagline: "A lightweight Litecoin Electrum server"
description: >-
  Run a personal Litecoin Electrum server powered by ElectrumX 2.0 and Litecoin Core.
  Connect Electrum-compatible Litecoin wallets directly to your own indexed node over
  your local network or Tor. ElectrumX (LTC) is an independent indexer and can satisfy
  the same Electrs (LTC) capability used by compatible applications such as Litecoin Space.
releaseNotes: >-
  Updates the GUI to Fastify 5.12.1 to resolve CVE-2026-18504 and CVE-2026-16732,
  and keeps the Connect dialog's decorative border fixed while its mobile content scrolls.
developer: "Electrum developers and RyleaStark"
website: https://electrumx-spesmilo.readthedocs.io/
dependencies:
  - extended-umbrella-litecoin-core
repo: https://github.com/RyleaStark/umbrel-litecoin-electrumx
support: https://github.com/RyleaStark/umbrel-litecoin-electrumx/issues
port: 2108
icon: https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-electrumx/gallery/icon.png
gallery:
  - https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-electrumx/gallery/1.png
  - https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-electrumx/gallery/2.png
  - https://raw.githubusercontent.com/RyleaStark/extended-umbrella/refs/heads/master/extended-umbrella-litecoin-electrumx/gallery/3.png
path: ""
defaultUsername: ""
defaultPassword: ""
backupIgnore:
  - data/electrumx/meta
  - data/electrumx/hist
submitter: "Rylea Stark"
submission: https://github.com/RyleaStark/extended-umbrella/pull/28
